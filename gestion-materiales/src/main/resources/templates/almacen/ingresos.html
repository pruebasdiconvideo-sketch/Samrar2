<!doctype html>
<html xmlns:th="http://thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Ingreso de Materiales - Smart Power On</title>
    <link
      rel="stylesheet"
      th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <div class="container pb-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white fw-semibold">
              Registro de Ingreso de Materiales (Orden de Compra)
            </div>
            <div class="card-body">
              <form id="formIngreso">
                <div class="row g-2 mb-3">
                  <div class="col-md-6">
                    <label for="codigoOc" class="form-label fw-semibold small"
                      >Orden de Compra (Seleccione o digite) *</label
                    >
                    <input
                      type="text"
                      id="codigoOc"
                      list="listaOcs"
                      class="form-control"
                      placeholder="Ej. OC-PICO-2026-015"
                      required
                    />
                    <datalist id="listaOcs">
                      <option
                        th:each="oc : ${ordenesCompra}"
                        th:value="${oc.codigo}"
                        th:label="${oc.codigo + ' - ' + oc.proveedor}"
                      ></option>
                    </datalist>
                  </div>
                  <div class="col-md-6">
                    <label for="proveedor" class="form-label fw-semibold small"
                      >Proveedor</label
                    >
                    <input
                      type="text"
                      id="proveedor"
                      list="listaProveedores"
                      class="form-control"
                      placeholder="Ej. Siemens S.A.C. / Phoenix Contact"
                    />
                    <datalist id="listaProveedores">
                      <option
                        value="Siemens S.A.C. (Smart Infrastructure)"
                      ></option>
                      <option value="Phoenix Contact Perú S.A.C."></option>
                      <option value="Schneider Electric Perú S.A."></option>
                    </datalist>
                  </div>
                </div>

                <div class="row g-2 mb-3">
                  <div class="col-md-6">
                    <label
                      for="proyectoDestino"
                      class="form-label fw-semibold small"
                      >Proyecto Destino *</label
                    >
                    <select id="proyectoDestino" class="form-select" required>
                      <option
                        th:each="p : ${proyectos}"
                        th:value="${p.codigo}"
                        th:text="${p.codigo + ' - ' + p.cliente}"
                      ></option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="ubicacion" class="form-label fw-semibold small"
                      >Ubicación en Almacén</label
                    >
                    <input
                      type="text"
                      id="ubicacion"
                      class="form-control"
                      placeholder="Ej. Pasillo 1 - Anaquel 4 - Piso 2"
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label for="idMaterial" class="form-label fw-semibold small"
                    >Equipo / Material del Catálogo *</label
                  >
                  <select id="idMaterial" class="form-select" required>
                    <option value="">-- Seleccione equipo o material --</option>
                    <option
                      th:each="m : ${materiales}"
                      th:value="${m.idMaterial}"
                      th:data-codigo="${m.codigo}"
                      th:text="${m.codigo + ' - ' + m.nombre}"
                    ></option>
                  </select>
                </div>

                <div class="mb-4">
                  <label for="cantidad" class="form-label fw-semibold small"
                    >Cantidad Recibida *</label
                  >
                  <input
                    type="number"
                    id="cantidad"
                    min="1"
                    class="form-control"
                    required
                  />
                </div>

                <button type="submit" class="btn btn-success w-100 fw-semibold">
                  Registrar Ingreso y Actualizar Stock del Proyecto
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"
    ></script>
    <script>
      // Evita mostrar códigos repetidos en el desplegable de equipos para que sea más limpio elegir
      const vistos = new Set();
      document
        .querySelectorAll("#idMaterial option[data-codigo]")
        .forEach((opt) => {
          const cod = opt.getAttribute("data-codigo");
          if (vistos.has(cod)) opt.remove();
          else vistos.add(cod);
        });

      document
        .getElementById("formIngreso")
        ?.addEventListener("submit", async (e) => {
          e.preventDefault();
          const data = {
            codigoOc: document.getElementById("codigoOc").value.trim(),
            proveedor: document.getElementById("proveedor").value.trim(),
            proyectoDestino: document.getElementById("proyectoDestino").value,
            ubicacion: document.getElementById("ubicacion").value.trim(),
            idMaterial: Number.parseInt(
              document.getElementById("idMaterial").value,
            ),
            cantidad: Number.parseInt(
              document.getElementById("cantidad").value,
            ),
          };
          const res = await fetch("/api/almacen/ingresos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (res.ok) {
            const m = await res.json();
            alert(
              `Ingreso registrado en ${m.proyectoAsignado}.\nNuevo stock de ${m.codigo}: ${m.stockActual} unidades.`,
            );
            document.getElementById("cantidad").value = "";
          } else {
            alert((await res.json()).error);
          }
        });
    </script>
  </body>
</html>
