<!doctype html>
<html xmlns:th="http://thymeleaf.org" lang="es">
  <head th:replace="fragments/head :: head('Aprobaciones de Presupuesto')"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="app-main container pb-5">
      <div class="page-header">
        <div>
          <h4 class="page-title">
            <span class="title-icon"><i class="bi bi-shield-check"></i></span>
            Solicitudes Retenidas por Exceso de Presupuesto
          </h4>
          <p class="page-subtitle">Aprobación o rechazo de OTI que superan el presupuesto del proyecto</p>
        </div>
      </div>

      <div class="card card-spo">
        <div class="tabla-toolbar">
          <div class="tabla-search">
            <i class="bi bi-search"></i>
            <input type="text" id="busquedaAprob" class="form-control" placeholder="Buscar por ID, proyecto o solicitante..." />
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="tablaAprob">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Proyecto</th>
                <th>Presupuesto</th>
                <th>Costo Solicitud</th>
                <th>Solicitante</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="s : ${retenidas}">
                <td th:text="'#' + ${s.idSolicitud}"></td>
                <td th:text="${s.proyecto.codigo + ' - ' + s.proyecto.cliente}"></td>
                <td th:text="'S/ ' + ${s.proyecto.presupuesto}"></td>
                <td class="fw-bold text-danger" th:text="'S/ ' + ${s.costoTotal}"></td>
                <td th:text="${s.usuarioSolicitante.nombreCompleto}"></td>
                <td>
                  <button class="btn btn-success btn-sm" th:onclick="'procesar(' + ${s.idSolicitud} + ', \'aprobar\')'">
                    <i class="bi bi-check-lg"></i> Aprobar
                  </button>
                  <button class="btn btn-danger btn-sm" th:onclick="'procesar(' + ${s.idSolicitud} + ', \'rechazar\')'">
                    <i class="bi bi-x-lg"></i> Rechazar
                  </button>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(retenidas)}" data-spo-ignore="true">
                <td colspan="6" class="text-center text-muted py-4">No hay solicitudes retenidas pendientes.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <th:block th:replace="fragments/scripts :: scripts"></th:block>
    <script>
      async function procesar(id, accion) {
        const res = await fetch(`/api/produccion/solicitudes/${id}/${accion}`, { method: "POST" });
        if (res.ok) { SPO.toast("Solicitud " + accion + "da.", "success"); setTimeout(() => location.reload(), 700); }
        else { const err = await res.json().catch(() => ({ error: "Error." })); SPO.toast(err.error, "danger"); }
      }

      SPO.paginacion.init("tablaAprob", { porPagina: 100, buscarInput: "busquedaAprob" });
    </script>
  </body>
</html>
