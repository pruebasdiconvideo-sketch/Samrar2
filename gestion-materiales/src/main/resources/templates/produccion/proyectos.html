<!doctype html>
<html xmlns:th="http://thymeleaf.org" lang="es">
  <head th:replace="fragments/head :: head('Proyectos de Ensamble')"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="app-main container pb-5">
      <div class="page-header">
        <div>
          <h4 class="page-title">
            <span class="title-icon"><i class="bi bi-kanban"></i></span>
            Proyectos de Ensamble de Celdas
          </h4>
          <p class="page-subtitle">Gestión y delegación de proyectos de producción</p>
        </div>
        <button th:if="${rolActual == 'JEFE_PRODUCCION' or rolActual == 'ADMIN'}"
                class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalProyecto">
          <i class="bi bi-plus-lg"></i> Nuevo Proyecto
        </button>
      </div>

      <div class="card card-spo">
        <div class="tabla-toolbar">
          <div class="tabla-search">
            <i class="bi bi-search"></i>
            <input type="text" id="busquedaProyectos" class="form-control" placeholder="Buscar por código, cliente, responsable..." />
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="tablaProyectos">
            <thead class="table-dark">
              <tr>
                <th>Código</th>
                <th>Cliente / Obra</th>
                <th>Fecha Inicio</th>
                <th>Entrega Estimada</th>
                <th>Responsable Delegado</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${proyectos}">
                <td class="fw-bold text-nowrap" th:text="${p.codigo}"></td>
                <td th:text="${p.cliente}"></td>
                <td th:text="${p.fechaInicio}"></td>
                <td th:text="${p.fechaEntregaEstimada ?: '-'}"></td>
                <td><span class="badge bg-secondary" th:text="${p.responsable ?: 'Sin asignar'}"></span></td>
                <td><span class="badge bg-info text-dark" th:text="${p.estado}"></span></td>
              </tr>
              <tr th:if="${#lists.isEmpty(proyectos)}">
                <td colspan="6" class="text-center text-muted py-4">No hay proyectos registrados.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Modal Nuevo Proyecto -->
    <div class="modal fade" id="modalProyecto" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header navbar-spo text-white">
            <h5 class="modal-title"><i class="bi bi-kanban"></i> Registrar y Asignar Proyecto</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <form id="formProyecto">
            <div class="modal-body">
              <div class="mb-2">
                <label for="codigo" class="form-label fw-semibold small">Código de Proyecto *</label>
                <input type="text" id="codigo" class="form-control" placeholder="Ej. PE-SAYA-S03-K8810" required />
              </div>
              <div class="mb-2">
                <label for="cliente" class="form-label fw-semibold small">Cliente / Subestación *</label>
                <input type="text" id="cliente" class="form-control" required />
              </div>
              <div class="row g-2 mb-2">
                <div class="col-md-6">
                  <label for="fechaInicio" class="form-label fw-semibold small">Fecha de Inicio *</label>
                  <input type="date" id="fechaInicio" class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label for="fechaEntregaEstimada" class="form-label fw-semibold small">Entrega Estimada *</label>
                  <input type="date" id="fechaEntregaEstimada" class="form-control" required />
                </div>
              </div>
              <div class="mb-2">
                <label for="responsable" class="form-label fw-semibold small">Delegar a (Supervisor / Técnico) *</label>
                <input type="text" id="responsable" class="form-control" placeholder="Escriba el nombre del responsable" required />
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar Proyecto</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <th:block th:replace="fragments/scripts :: scripts"></th:block>
    <script>
      document.getElementById("formProyecto")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = {
          codigo: document.getElementById("codigo").value.trim(),
          cliente: document.getElementById("cliente").value.trim(),
          fechaInicio: document.getElementById("fechaInicio").value,
          fechaEntregaEstimada: document.getElementById("fechaEntregaEstimada").value,
          responsable: document.getElementById("responsable").value.trim(),
        };
        const res = await fetch("/api/produccion/proyectos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (res.ok) { SPO.toast("Proyecto registrado.", "success"); setTimeout(() => location.reload(), 700); }
        else { const err = await res.json().catch(() => ({ error: "Error al registrar." })); SPO.toast(err.error, "danger"); }
      });

      SPO.paginacion.init("tablaProyectos", { porPagina: 100, buscarInput: "busquedaProyectos" });
    </script>
  </body>
</html>
