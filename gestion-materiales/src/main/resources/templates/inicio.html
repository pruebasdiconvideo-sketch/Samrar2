<!doctype html>
<html xmlns:th="http://thymeleaf.org" lang="es">
  <head th:replace="fragments/head :: head('Panel Principal')"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="app-main container-fluid px-3 px-lg-4 pb-5">
      <div class="page-header">
        <div>
          <h3 class="page-title">
            <span class="title-icon"><i class="bi bi-speedometer2"></i></span>
            Bienvenido,
            <span th:text="${usuarioActual != null ? usuarioActual.nombreCompleto : 'Usuario'}">Usuario</span>
          </h3>
          <p class="page-subtitle">Panel de control operativo — Planta Comas, Lima</p>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-6 col-lg-4">
          <div class="card kpi-card border-warning">
            <div class="kpi-body">
              <span class="kpi-icon"><i class="bi bi-exclamation-triangle"></i></span>
              <div class="flex-grow-1">
                <p class="kpi-label">Materiales en Stock Mínimo</p>
                <p class="kpi-value text-warning" th:text="${alertasStock}">0</p>
                <a th:if="${rolActual == 'ADMIN' or rolActual == 'ALMACENERO' or rolActual == 'JEFE_PRODUCCION'}"
                   th:href="@{/almacen/catalogo}" class="kpi-link text-decoration-none">
                  Ver inventario <i class="bi bi-arrow-right"></i>
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-lg-4">
          <div class="card kpi-card border-danger">
            <div class="kpi-body">
              <span class="kpi-icon"><i class="bi bi-shield-exclamation"></i></span>
              <div class="flex-grow-1">
                <p class="kpi-label">Solicitudes Retenidas</p>
                <p class="kpi-value text-danger" th:text="${solicitudesRetenidas}">0</p>
                <a th:if="${rolActual == 'ADMIN'}" th:href="@{/produccion/aprobaciones}" class="kpi-link text-decoration-none">
                  Revisar aprobaciones <i class="bi bi-arrow-right"></i>
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6 col-lg-4">
          <div class="card kpi-card border-primary">
            <div class="kpi-body">
              <span class="kpi-icon"><i class="bi bi-box-arrow-right"></i></span>
              <div class="flex-grow-1">
                <p class="kpi-label">Solicitudes Listas para Despacho</p>
                <p class="kpi-value text-primary" th:text="${colaDespacho}">0</p>
                <a th:if="${rolActual == 'ALMACENERO'}" th:href="@{/despacho/cola}" class="kpi-link text-decoration-none">
                  Ir a despachos <i class="bi bi-arrow-right"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Accesos rápidos según rol -->
      <div class="card card-spo">
        <div class="card-header"><i class="bi bi-grid-3x3-gap"></i> Accesos rápidos</div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col-6 col-md-3" th:if="${rolActual == 'ADMIN' or rolActual == 'ALMACENERO' or rolActual == 'JEFE_PRODUCCION'}">
              <a th:href="@{/almacen/catalogo}" class="btn btn-outline-primary w-100 text-start">
                <i class="bi bi-box-seam"></i> Catálogo
              </a>
            </div>
            <div class="col-6 col-md-3" th:if="${rolActual == 'JEFE_PRODUCCION' or rolActual == 'ADMIN'}">
              <a th:href="@{/produccion/proyectos}" class="btn btn-outline-primary w-100 text-start">
                <i class="bi bi-kanban"></i> Proyectos
              </a>
            </div>
            <div class="col-6 col-md-3" th:if="${rolActual == 'JEFE_PRODUCCION' or rolActual == 'ADMIN'}">
              <a th:href="@{/produccion/solicitudes}" class="btn btn-outline-primary w-100 text-start">
                <i class="bi bi-list-check"></i> Solicitudes
              </a>
            </div>
            <div class="col-6 col-md-3" th:if="${rolActual == 'INSPECTOR' or rolActual == 'JEFE_PRODUCCION' or rolActual == 'ADMIN'}">
              <a th:href="@{/calidad/pruebas}" class="btn btn-outline-primary w-100 text-start">
                <i class="bi bi-clipboard-check"></i> Calidad FAT
              </a>
            </div>
            <div class="col-6 col-md-3" th:if="${rolActual == 'OPERARIO_ENSAMBLE' or rolActual == 'ALMACENERO' or rolActual == 'JEFE_PRODUCCION'}">
              <a th:href="@{/merma/gestion}" class="btn btn-outline-primary w-100 text-start">
                <i class="bi bi-arrow-repeat"></i> Mermas
              </a>
            </div>
            <div class="col-6 col-md-3" th:if="${rolActual == 'JEFE_PRODUCCION' or rolActual == 'ADMIN'}">
              <a th:href="@{/trazabilidad}" class="btn btn-outline-primary w-100 text-start">
                <i class="bi bi-clock-history"></i> Trazabilidad
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <th:block th:replace="fragments/scripts :: scripts"></th:block>
  </body>
</html>
