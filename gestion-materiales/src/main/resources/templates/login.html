<!doctype html>
<html xmlns:th="http://thymeleaf.org" lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Smart Power On S.A.C.</title>
    <link
      rel="stylesheet"
      th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"
    />
  </head>
  <body class="bg-dark d-flex align-items-center min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-6 col-lg-4">
          <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div
              class="card-header bg-primary bg-gradient text-white text-center py-4 border-bottom border-warning border-4"
            >
              <span
                class="badge bg-warning text-dark fw-bold px-3 py-1 rounded-pill mb-2"
              >
                SMART POWER ON S.A.C.
              </span>
              <h4 class="fw-bold mb-0">Acceso al Sistema</h4>
              <small class="text-white-50"
                >Gestión de Materiales y Producción</small
              >
            </div>

            <div class="card-body p-4 bg-white">
              <div
                th:if="${param.error}"
                class="alert alert-danger py-2 small text-center"
                role="alert"
              >
                Correo o contraseña incorrectos, o cuenta inactiva.
              </div>

              <div
                th:if="${param.logout}"
                class="alert alert-success py-2 small text-center"
                role="alert"
              >
                Sesión cerrada correctamente.
              </div>

              <form th:action="@{/login}" method="post">
                <div class="mb-3">
                  <label
                    for="correo"
                    class="form-label fw-semibold small text-secondary"
                    >Correo Institucional</label
                  >
                  <input
                    type="email"
                    id="correo"
                    name="correo"
                    class="form-control form-control-lg fs-6"
                    placeholder="nombre@smartpoweron.pe"
                    required
                    autofocus
                  />
                </div>

                <div class="mb-4">
                  <label
                    for="password"
                    class="form-label fw-semibold small text-secondary"
                    >Contraseña</label
                  >
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control form-control-lg fs-6"
                    placeholder="••••••••"
                    required
                  />
                </div>

                <div class="d-grid">
                  <button
                    type="submit"
                    class="btn btn-primary btn-lg fw-semibold shadow-sm"
                  >
                    Ingresar
                  </button>
                </div>
              </form>
            </div>

            <div class="card-footer bg-light text-center py-2 border-0">
              <small class="text-muted">Planta Industrial Comas — Lima</small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"
    ></script>
  </body>
</html>
