<!doctype html>
<html xmlns:th="http://thymeleaf.org" lang="es">
  <head th:replace="fragments/head :: head('Acceso al Sistema')"></head>
  <body class="d-flex flex-column min-vh-100" style="background: linear-gradient(135deg, #0d3b66 0%, #0a2f52 100%);">
    <main class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
              <div class="card-header bg-primary bg-gradient text-white text-center py-4 border-bottom border-warning border-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-warning text-dark rounded-circle mb-2"
                     style="width:54px;height:54px;font-size:1.5rem;">
                  <i class="bi bi-lightning-charge-fill"></i>
                </div>
                <span class="badge bg-warning text-dark fw-bold px-3 py-1 rounded-pill mb-2">
                  SMART POWER ON S.A.C.
                </span>
                <h4 class="fw-bold mb-0"><i class="bi bi-shield-lock"></i> Acceso al Sistema</h4>
                <small class="text-white-50">Gestión de Materiales y Producción</small>
              </div>

              <div class="card-body p-4 bg-white">
                <div th:if="${param.error}" class="alert alert-danger py-2 small text-center" role="alert">
                  <i class="bi bi-exclamation-triangle"></i> Correo o contraseña incorrectos, o cuenta inactiva.
                </div>
                <div th:if="${param.logout}" class="alert alert-success py-2 small text-center" role="alert">
                  <i class="bi bi-check-circle"></i> Sesión cerrada correctamente.
                </div>

                <form th:action="@{/login}" method="post">
                  <div class="mb-3">
                    <label for="correo" class="form-label fw-semibold small text-secondary">
                      <i class="bi bi-envelope"></i> Correo Institucional
                    </label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-person"></i></span>
                      <input type="email" id="correo" name="correo"
                             class="form-control form-control-lg fs-6"
                             placeholder="nombre@smartpoweron.pe" required autofocus />
                    </div>
                  </div>

                  <div class="mb-4">
                    <label for="password" class="form-label fw-semibold small text-secondary">
                      <i class="bi bi-key"></i> Contraseña
                    </label>
                    <div class="input-group">
                      <span class="input-group-text"><i class="bi bi-lock"></i></span>
                      <input type="password" id="password" name="password"
                             class="form-control form-control-lg fs-6"
                             placeholder="••••••••" required />
                    </div>
                  </div>

                  <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg fw-semibold shadow-sm">
                      <i class="bi bi-box-arrow-in-right"></i> Ingresar
                    </button>
                  </div>
                </form>
              </div>

              <div class="card-footer bg-light text-center py-2 border-0">
                <small class="text-muted"><i class="bi bi-geo-alt"></i> Planta Industrial Comas — Lima</small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="app-footer">
      <div class="container-fluid px-3 px-lg-4">
        <div class="footer-bottom d-flex flex-wrap justify-content-between gap-2">
          <span><i class="bi bi-lightning-charge-fill"></i> Smart Power On S.A.C.</span>
          <span>Planta Industrial Comas · Lima, Perú</span>
        </div>
      </div>
    </footer>

    <th:block th:replace="fragments/scripts :: scripts"></th:block>
  </body>
</html>
