<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!--
      Modal único y reutilizable para búsqueda + selección de entidades.
      Se controla con SPO.buscadorModal.abrir({...}) desde app.js.
      Debe incluirse una sola vez por página (lo traen las plantillas que lo usan).
    -->
    <div class="modal fade" id="buscadorModal" tabindex="-1" aria-hidden="true" th:fragment="buscador">
      <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header navbar-spo text-white">
            <h5 class="modal-title"><i class="bi bi-search"></i> Buscar y seleccionar</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="input-group mb-3">
              <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
              <input type="text" class="form-control buscador-input" placeholder="Escriba para buscar..." autocomplete="off" />
              <button type="button" class="btn btn-outline-secondary buscador-limpiar" title="Limpiar">
                <i class="bi bi-eraser"></i>
              </button>
            </div>

            <div class="text-center text-muted small py-4 buscador-cargando d-none">
              <div class="spinner-border spinner-border-sm me-2"></div> Cargando datos...
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle resultado-buscador mb-0">
                <thead><tr></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <div class="modal-footer flex-column align-items-stretch">
            <div class="d-flex justify-content-between align-items-center w-100">
              <span class="text-muted small buscador-info"></span>
              <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="bi bi-x-lg"></i> Cancelar
              </button>
            </div>
            <nav class="buscador-pag d-flex justify-content-center w-100"></nav>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
