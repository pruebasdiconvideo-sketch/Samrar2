<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <!--
    Fragmento <head> compartido.
    Uso:  <head th:replace="fragments/head :: head('Título de la página')"></head>
  -->
  <head th:fragment="head(titulo)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Gestión de Materiales y Producción — Smart Power On S.A.C." />
    <title th:text="${titulo} + ' · Smart Power On'">Smart Power On</title>

    <!-- Bootstrap 5.3.3 (webjar) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" />
    <!-- Bootstrap Icons 1.11.3 (webjar) -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css}" />
    <!-- Estilos propios -->
    <link rel="stylesheet" th:href="@{/css/app.css}" />
  </head>
</html>
