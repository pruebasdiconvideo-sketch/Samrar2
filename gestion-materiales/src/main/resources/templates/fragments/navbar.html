<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <nav
      th:fragment="menu"
      class="navbar navbar-expand-lg navbar-dark navbar-spo shadow-sm"
      th:with="uri=${requestURI}"
    >
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand" th:href="@{/inicio}">
          <span class="brand-logo"><i class="bi bi-lightning-charge-fill"></i></span>
          <span>Smart Power On</span>
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navPrincipal"
          aria-controls="navPrincipal"
          aria-expanded="false"
          aria-label="Abrir menú"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navPrincipal">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/inicio}" th:classappend="${uri == '/inicio' or uri == '/'} ? 'active' : ''">
                <i class="bi bi-house-door"></i> Inicio
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'ADMIN' or rolActual == 'ALMACENERO' or rolActual == 'JEFE_PRODUCCION'}">
              <a class="nav-link" th:href="@{/almacen/catalogo}" th:classappend="${uri == '/almacen/catalogo'} ? 'active' : ''">
                <i class="bi bi-box-seam"></i> Catálogo
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'ALMACENERO'}">
              <a class="nav-link" th:href="@{/almacen/ingresos}" th:classappend="${uri == '/almacen/ingresos'} ? 'active' : ''">
                <i class="bi bi-truck"></i> Ingresos OC
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'JEFE_PRODUCCION' or rolActual == 'ADMIN'}">
              <a class="nav-link" th:href="@{/produccion/proyectos}" th:classappend="${uri == '/produccion/proyectos'} ? 'active' : ''">
                <i class="bi bi-kanban"></i> Proyectos
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'JEFE_PRODUCCION' or rolActual == 'ADMIN'}">
              <a class="nav-link" th:href="@{/produccion/solicitudes}" th:classappend="${uri == '/produccion/solicitudes'} ? 'active' : ''">
                <i class="bi bi-list-check"></i> Solicitudes
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'ADMIN'}">
              <a class="nav-link" th:href="@{/produccion/aprobaciones}" th:classappend="${uri == '/produccion/aprobaciones'} ? 'active' : ''">
                <i class="bi bi-shield-check"></i> Aprobaciones
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'ALMACENERO'}">
              <a class="nav-link" th:href="@{/despacho/cola}" th:classappend="${uri == '/despacho/cola'} ? 'active' : ''">
                <i class="bi bi-box-arrow-right"></i> Despachos
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'OPERARIO_ENSAMBLE'}">
              <a class="nav-link" th:href="@{/despacho/confirmar}" th:classappend="${uri == '/despacho/confirmar'} ? 'active' : ''">
                <i class="bi bi-check2-circle"></i> Confirmar Entrega
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'INSPECTOR' or rolActual == 'JEFE_PRODUCCION' or rolActual == 'ADMIN'}">
              <a class="nav-link" th:href="@{/calidad/pruebas}" th:classappend="${uri == '/calidad/pruebas'} ? 'active' : ''">
                <i class="bi bi-clipboard-check"></i> Calidad FAT
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'OPERARIO_ENSAMBLE' or rolActual == 'ALMACENERO' or rolActual == 'JEFE_PRODUCCION'}">
              <a class="nav-link" th:href="@{/merma/gestion}" th:classappend="${uri == '/merma/gestion'} ? 'active' : ''">
                <i class="bi bi-arrow-repeat"></i> Mermas/Devoluciones
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'JEFE_PRODUCCION' or rolActual == 'ADMIN'}">
              <a class="nav-link" th:href="@{/trazabilidad}" th:classappend="${uri == '/trazabilidad'} ? 'active' : ''">
                <i class="bi bi-clock-history"></i> Trazabilidad
              </a>
            </li>

            <li class="nav-item" th:if="${rolActual == 'ADMIN'}">
              <a class="nav-link" th:href="@{/admin/usuarios}" th:classappend="${uri == '/admin/usuarios'} ? 'active' : ''">
                <i class="bi bi-gear"></i> Administración
              </a>
            </li>
          </ul>

          <div class="d-flex align-items-center text-white gap-2 gap-lg-3 flex-wrap" th:if="${usuarioActual != null}">
            <span class="small d-inline-flex align-items-center gap-1">
              <i class="bi bi-person-circle"></i>
              <strong th:text="${usuarioActual.nombreCompleto}">Usuario</strong>
              <span class="badge bg-warning text-dark ms-1" th:text="${rolActual}">ROL</span>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
              <button type="submit" class="btn btn-sm btn-outline-light">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
              </button>
            </form>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
