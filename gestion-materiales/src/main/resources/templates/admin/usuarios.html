<!doctype html>
<html xmlns:th="http://thymeleaf.org" lang="es">
  <head th:replace="fragments/head :: head('Administración de Usuarios')"></head>
  <body class="bg-light">
    <div th:replace="~{fragments/navbar :: menu}"></div>

    <main class="app-main container pb-5">
      <div class="page-header">
        <div>
          <h4 class="page-title">
            <span class="title-icon"><i class="bi bi-gear"></i></span>
            Gestión de Usuarios y Roles
          </h4>
          <p class="page-subtitle">Administración de cuentas de acceso y permisos por rol</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalUsuario">
          <i class="bi bi-person-plus"></i> Nuevo Usuario
        </button>
      </div>

      <div class="card card-spo mb-4">
        <div class="tabla-toolbar">
          <div class="tabla-search">
            <i class="bi bi-search"></i>
            <input type="text" id="busquedaUsuarios" class="form-control" placeholder="Buscar por nombre, correo o rol..." />
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0" id="tablaUsuarios">
            <thead class="table-dark">
              <tr>
                <th>Nombre Completo</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(usuarios)}" data-spo-ignore="true">
                <td colspan="5" class="text-center text-muted py-4">No hay usuarios registrados.</td>
              </tr>
              <tr th:each="u : ${usuarios}">
                <td th:text="${u.nombreCompleto}"></td>
                <td th:text="${u.correo}"></td>
                <td><span class="badge bg-primary" th:text="${u.rol.nombre}"></span></td>
                <td><span class="badge" th:classappend="${u.activo} ? 'bg-success' : 'bg-danger'" th:text="${u.activo ? 'ACTIVO' : 'INACTIVO'}"></span></td>
                <td>
                  <button class="btn btn-sm btn-outline-secondary" th:onclick="'toggleEstado(' + ${u.idUsuario} + ', ' + ${!u.activo} + ')'">
                    <i class="bi" th:classappend="${u.activo ? 'bi-toggle-on' : 'bi-toggle-off'}"></i>
                    <span th:text="${u.activo ? 'Desactivar' : 'Activar'}"></span>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="page-header">
        <h5 class="page-title">
          <span class="title-icon"><i class="bi bi-rulers"></i></span>
          Parámetros Normativos de Pruebas Eléctricas
        </h5>
      </div>
      <div class="card card-spo">
        <div class="tabla-toolbar">
          <div class="tabla-search">
            <i class="bi bi-search"></i>
            <input type="text" id="busquedaParametros" class="form-control" placeholder="Buscar por tipo de prueba o norma..." />
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered align-middle mb-0" id="tablaParametros">
            <thead class="table-dark">
              <tr>
                <th>Tipo de Prueba</th>
                <th>Unidad</th>
                <th>Mínimo</th>
                <th>Máximo</th>
                <th>Norma Técnica</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(parametros)}" data-spo-ignore="true">
                <td colspan="5" class="text-center text-muted py-4">No hay parámetros configurados.</td>
              </tr>
              <tr th:each="p : ${parametros}">
                <td class="fw-bold" th:text="${p.tipoPrueba}"></td>
                <td th:text="${p.unidad}"></td>
                <td th:text="${p.valorMinimo}"></td>
                <td th:text="${p.valorMaximo}"></td>
                <td th:text="${p.normaReferencia}"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- Modal Nuevo Usuario -->
    <div class="modal fade" id="modalUsuario" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header navbar-spo text-white">
            <h5 class="modal-title"><i class="bi bi-person-plus"></i> Crear Usuario</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <form id="formUsuario">
            <div class="modal-body">
              <div class="mb-2">
                <label class="form-label">Nombre Completo *</label>
                <input type="text" id="nombreCompleto" class="form-control" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Correo *</label>
                <input type="email" id="correo" class="form-control" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Contraseña *</label>
                <input type="password" id="password" class="form-control" required />
              </div>
              <div class="mb-2">
                <label class="form-label">Rol *</label>
                <div class="buscador-campo input-group">
                  <input type="hidden" id="idRol" />
                  <input type="text" id="idRolTexto" class="form-control placeholder-muted" placeholder="Buscar rol..." readonly required />
                  <button type="button" class="btn btn-outline-primary" onclick="abrirBuscadorRol()"><i class="bi bi-search"></i></button>
                  <button type="button" class="btn btn-outline-secondary" onclick="limpiarBuscador('idRol')" title="Limpiar"><i class="bi bi-x-lg"></i></button>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar Usuario</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/buscador-modal :: buscador}"></div>
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:inline="javascript">
      const ROLES = /*[[${roles.![{ 'idRol': idRol, 'nombre': nombre }]}]]*/ [];
    </script>
    <th:block th:replace="fragments/scripts :: scripts"></th:block>
    <script th:inline="javascript">
      const rolesData = (ROLES || []).map((r) => ({ idRol: r.idRol, nombre: r.nombre || "" }));

      function limpiarBuscador(base) {
        document.getElementById(base).value = "";
        const t = document.getElementById(base + "Texto");
        if (t) t.value = "";
      }

      function abrirBuscadorRol() {
        SPO.buscadorModal.abrir({
          titulo: "Seleccionar rol",
          icono: "bi-person-badge",
          datos: rolesData,
          placeholder: "Buscar rol...",
          buscarEn: ["nombre"],
          columnas: [
            { titulo: "Rol", campo: "nombre", clase: "fw-bold" },
          ],
          vacio: "No se encontraron roles.",
          alSeleccionar: (r) => {
            document.getElementById("idRol").value = r.idRol;
            document.getElementById("idRolTexto").value = r.nombre;
          },
        });
      }

      document.getElementById("formUsuario")?.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!document.getElementById("idRol").value) { SPO.toast("Seleccione un rol.", "warning"); return; }
        const data = {
          nombreCompleto: document.getElementById("nombreCompleto").value,
          correo: document.getElementById("correo").value,
          password: document.getElementById("password").value,
          idRol: document.getElementById("idRol").value,
        };
        const res = await fetch("/api/admin/usuarios", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (res.ok) { SPO.toast("Usuario creado.", "success"); setTimeout(() => location.reload(), 700); }
        else { const err = await res.json().catch(() => ({ error: "Error." })); SPO.toast(err.error, "danger"); }
      });

      async function toggleEstado(id, activo) {
        const res = await fetch(`/api/admin/usuarios/${id}/estado`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ activo }),
        });
        if (res.ok) { SPO.toast("Estado actualizado.", "success"); setTimeout(() => location.reload(), 700); }
        else { const err = await res.json().catch(() => ({ error: "Error." })); SPO.toast(err.error, "danger"); }
      }

      SPO.paginacion.init("tablaUsuarios", { porPagina: 100, buscarInput: "busquedaUsuarios" });
      SPO.paginacion.init("tablaParametros", { porPagina: 100, buscarInput: "busquedaParametros" });
    </script>
  </body>
</html>
