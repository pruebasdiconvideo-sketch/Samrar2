server.port=8081

# Conexión a la nueva base de datos limpia
spring.datasource.url=jdbc:mysql://localhost:3306/smart_power_on_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate verifica que tus clases Java coincidan exactamente con las 16 tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Desactivar caché de Thymeleaf para desarrollo
spring.thymeleaf.cache=false

# Clave secreta y tiempo de expiración para los tokens JWT
jwt.secret=SmartPowerOn2026ClaveSecretaMuySeguraParaTokensJWT256Bits
jwt.expiration=28800000
