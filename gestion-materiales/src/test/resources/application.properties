# Configuración para pruebas de integración: H2 en memoria (sin MySQL)
server.port=0

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crea las tablas desde las entidades (no valida contra MySQL)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

spring.thymeleaf.cache=false

jwt.secret=SmartPowerOn2026ClaveSecretaMuySeguraParaTokensJWT256Bits
jwt.expiration=28800000
